[project]
name = "dpn-system-optimizer"
version = "2.0.0"
description = "DPN Technology Windows system maintenance utility: preview-first cleanup and diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary - Copyright 2026 DPN Technology"}
authors = [{name = "DPN Technology"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows"]
dependencies = []

[project.optional-dependencies]
monitoring = ["psutil>=5.9,<8"]

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# Include Python correctness checks; style-only rewriting is not a CI requirement.
select = ["E4", "E7", "E9", "F"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
# All three subprocess call sites use constant argv lists, no shell=True.
skips = ["B404", "B603", "B607"]
