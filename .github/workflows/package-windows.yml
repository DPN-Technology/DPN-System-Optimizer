name: DPN Windows Package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Windows package + checksum
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify source before packaging
        run: python -m unittest discover -s tests -v
      - name: Package only allowlisted application files
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify checksum and zip contents
        shell: pwsh
        run: ./scripts/verify-package.ps1
      - name: Publish reproducible source distribution artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DPN-System-Optimizer-Windows
          path: |
            dist/DPN_System_Optimizer_v2.0_Windows.zip
            dist/DPN_System_Optimizer_v2.0_Windows.zip.sha256
          if-no-files-found: error
          retention-days: 90
