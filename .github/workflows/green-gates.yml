name: DPN Green Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: green-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check ruff==0.11.13
      - run: ruff check --output-format github .
      - run: python -m compileall -q dpn_optimizer dpn_system_optimizer.py tests

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Safety and behavior tests
        run: python -m unittest discover -s tests -v
      - name: CLI diagnostic smoke test
        run: python dpn_system_optimizer.py diagnose
      - name: CLI help smoke test
        run: python dpn_system_optimizer.py --help

  security:
    name: Static analysis and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install scanners
        run: python -m pip install --disable-pip-version-check bandit==1.8.6 pip-audit==2.9.0
      - name: Bandit — medium/high findings block merge
        run: bandit -r dpn_optimizer dpn_system_optimizer.py -ll -q -s B404,B603,B607
      - name: Audit optional monitoring dependency
        run: pip-audit --strict -r requirements.txt
      - name: Audit pinned development dependencies
        run: pip-audit --strict -r requirements-dev.txt

  gate:
    name: Required policy gate
    if: always()
    needs: [lint, tests, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed if any required job failed, cancelled, or skipped
        env:
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          printf 'lint=%s tests=%s security=%s\n' "$LINT" "$TESTS" "$SECURITY"
          test "$LINT" = success && test "$TESTS" = success && test "$SECURITY" = success
