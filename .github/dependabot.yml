version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Detroit"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "America/Detroit"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
